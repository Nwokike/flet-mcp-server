version: "1"
startCommand:
  type: stdio
configSchema:
  type: object
  properties: {}
# This tells Smithery to build your Dockerfile instead of guessing the environment
deploy:
  docker:
    dockerfile: Dockerfile
commandFunction:
  |-
  (config) => ({
    command: 'uv',
    args: ['run', 'flet-mcp-server']
  })
