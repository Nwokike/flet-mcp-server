[project]
name = "flet-mcp-server"
version = "1.0.1"
description = "MCP server that makes the installed Flet source code the source of truth for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Onyeka Nwokike", email = "nwokikeonyeka@gmail.com" }
]
keywords = ["flet", "mcp", "ai", "agent", "documentation", "github-api", "introspection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "diskcache>=5.6.3",
    "flet>=0.86.0",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[project.urls]
Homepage = "https://github.com/Nwokike/flet-mcp-server"
Repository = "https://github.com/Nwokike/flet-mcp-server"
Issues = "https://github.com/Nwokike/flet-mcp-server/issues"

[project.scripts]
flet-mcp-server = "flet_mcp.main:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src/flet_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
source = ["flet_mcp"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
